name: ci-ghcr

on:
  push:
    branches:
      - main
      - "feat/**"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/austinhmh/api2cursor

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run unit tests
        run: python -m pytest -q

  image:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=ref,event=tag

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test image
        run: |
          set -euo pipefail
          image_reference="${IMAGE_NAME}:sha-${GITHUB_SHA}"
          container_name="api2cursor-smoke-${GITHUB_RUN_ID}"
          trap 'docker rm -f "${container_name}" >/dev/null 2>&1 || true' EXIT
          docker run -d --name "${container_name}" \
            -e PROXY_TARGET_URL="https://example.com" \
            -e PROXY_API_KEY="test" \
            -e ACCESS_API_KEY="" \
            -e DEBUG_MODE="off" \
            -p 127.0.0.1:3029:3029 \
            "${image_reference}"
          for i in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:3029/health" >/dev/null; then
              echo "health ok"
              exit 0
            fi
            sleep 2
          done
          docker logs "${container_name}" || true
          exit 1
