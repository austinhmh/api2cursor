services:
  api2cursor:
    image: ${API2CURSOR_IMAGE:-ghcr.io/austinhmh/api2cursor:latest}
    container_name: api2cursor
    ports:
      - "127.0.0.1:3029:3029"
    environment:
      PROXY_TARGET_URL: ${PROXY_TARGET_URL:-https://2api.austinhmh.com/v1}
      PROXY_API_KEY: ${PROXY_API_KEY:-}
      PROXY_PORT: "3029"
      API_TIMEOUT: "300"
      ACCESS_API_KEY: ${ACCESS_API_KEY:-austin-admin}
      DEBUG_MODE: ${DEBUG_MODE:-off}
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3029/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
